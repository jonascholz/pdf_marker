name: Android APK

# Every push and pull request: debug + release build (the release unsigned) as a check.
# Push to the default branch: the debug APK goes to the rolling pre-release "apk-dev".
# Tag v1.2.3: signed release APK published as GitHub release v1.2.3.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish releases

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      # The committed gradle-wrapper.jar must be an official Gradle build.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci --omit=dev --omit=optional
      - run: npm run assets

      - name: Build APKs
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # Fixed debug key so development APKs update in place; without it Gradle's default debug key signs.
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            export DEBUG_KEYSTORE="$RUNNER_TEMP/debug.keystore"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$DEBUG_KEYSTORE"
          fi
          if [ "$IS_RELEASE" = true ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
              echo "::error::Release tag but no RELEASE_KEYSTORE_BASE64 secret: refusing to publish an unsigned APK."
              exit 1
            fi
            export RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE"
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          ./gradlew assembleDebug assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/debug.keystore" "$RUNNER_TEMP/release.jks"

      - name: Name APK
        id: apk
        run: |
          if [ "$IS_RELEASE" = true ]; then
            NAME="pdf-reader-${GITHUB_REF_NAME}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$NAME"
          else
            NAME="pdf-reader-dev-${{ github.run_number }}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" \
            --verify-tag --title "PDF Reader $GITHUB_REF_NAME" --generate-notes

      # Rolling pre-release: always holds the newest development APK of the default branch.
      - name: Publish development build
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-dev --cleanup-tag --yes || true
          gh release create apk-dev "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Development build #${{ github.run_number }}" \
            --notes "Debug build of ${GITHUB_SHA::7}. Installs next to the released app as \"PDF Reader (dev)\". For everyday use, take the latest release instead."
